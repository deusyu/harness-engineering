<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="935" viewBox="0 0 1600 935" role="img">
<title>Split the maker from the checker</title>
<defs>
<style>
  .kicker { font-family: Menlo, 'SF Mono', monospace; font-size: 19px; letter-spacing: 2.5px;
            fill: #63635D; text-transform: uppercase; }
  .badge  { font-family: Menlo, 'SF Mono', monospace; font-size: 21px; font-weight: 700; fill: #0A0A0A; }
  .foot   { font-family: Menlo, 'SF Mono', monospace; font-size: 17px; letter-spacing: 1.2px; fill: #4A4A45; }
  .h1     { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 700; fill: #F5F3ED; }
  .h2     { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #F5F3ED; }
  .h3     { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #F5F3ED; }
  .lede   { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 24px; fill: #9A9A92; }
  .body   { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 21px; fill: #C9C7BF; }
  .small  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 19px; fill: #9A9A92; }
  .tag    { font-family: Menlo, 'SF Mono', monospace; font-size: 16px; letter-spacing: 2px;
            text-transform: uppercase; fill: #63635D; }
  .tagA   { font-family: Menlo, 'SF Mono', monospace; font-size: 16px; letter-spacing: 2px;
            text-transform: uppercase; fill: #FFD644; }
  .code   { font-family: Menlo, 'SF Mono', monospace; font-size: 20px; fill: #E8E6DF; }
  .codesm { font-family: Menlo, 'SF Mono', monospace; font-size: 18px; fill: #C9C7BF; }
  .acc    { fill: #FFD644; }
  .good   { fill: #7ED9A6; }
  .warn   { fill: #FF9E64; }
  .b      { font-weight: 700; }
</style>
<radialGradient id="glow" cx="0.82" cy="0.05" r="0.75">
  <stop offset="0%" stop-color="#4A3C10" stop-opacity="0.5"/>
  <stop offset="55%" stop-color="#201B08" stop-opacity="0.18"/>
  <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
</radialGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#63635D"/>
</marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#FFD644"/>
</marker>
<marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#FF9E64"/>
</marker>
</defs>
<rect width="1600" height="935" fill="#0A0A0A"/>
<rect width="1600" height="935" fill="url(#glow)"/>
<text x="70" y="62" class="kicker">Practical loop engineering &#183; addyosmani.com</text>
<rect x="1468" y="38" width="62" height="34" rx="17" fill="#FFD644"/>
<text x="1499" y="62" class="badge" text-anchor="middle">06</text>
<text x="70" y="897" class="foot">addyosmani.com</text>
<text x="70" y="160" class="h1">Split the maker from the checker</text><text x="70" y="226" class="lede">Never let the agent that did the work be the one that decides the work is good.</text>
<rect x="70" y="285" width="420" height="200" rx="14" fill="#131312" stroke="#282826" stroke-width="1.5"/><text x="98" y="323" class="tag">Sub-agent A</text><text x="98" y="366" class="h2">The maker</text><text x="98" y="406" class="small">Drafts the change. Has every</text><text x="98" y="434" class="small">reason to believe it worked.</text><line x1="490" y1="385" x2="580" y2="385" stroke="#63635D" stroke-width="2" marker-end="url(#ar)"/><rect x="500" y="330" width="70" height="36" rx="7" fill="#1B1B18" stroke="#30302B"/><text x="514" y="354" class="codesm">diff</text><rect x="580" y="285" width="420" height="200" rx="14" fill="#1A1608" stroke="#7A6820" stroke-width="1.5"/><text x="608" y="323" class="tagA">Sub-agent B</text><text x="608" y="366" class="h2">The checker</text><text x="608" y="406" class="small">Fresh context. Different model</text><text x="608" y="434" class="small">if you can. Tries to refute.</text><line x1="1000" y1="385" x2="1090" y2="385" stroke="#63635D" stroke-width="2" marker-end="url(#ar)"/><rect x="1090" y="285" width="440" height="200" rx="14" fill="#131312" stroke="#282826" stroke-width="1.5"/><text x="1118" y="323" class="tag">Verdict</text><text x="1118" y="366" class="small">Holds &#8594; ship it.</text><text x="1118" y="396" class="small">Fails &#8594; back to A with the</text><text x="1118" y="426" class="small">specific reason it failed.</text><path d="M1300 485 V545 H280 V495" stroke="#FF9E64" stroke-width="2" fill="none" marker-end="url(#arW)"/><rect x="70" y="592" width="715" height="214" rx="14" fill="#1C1209" stroke="#5A3A1E" stroke-width="1.5"/><text x="98" y="630" class="tag" fill="#FF9E64">What one-sided confidence looks like</text><text x="98" y="672" class="small">The maker reports performance is fine.</text><text x="98" y="702" class="small">It measured desktop only. You cared about</text><text x="98" y="732" class="small">mobile. It was confident about one dimension</text><text x="98" y="762" class="small">of the problem and silent on the other.</text><rect x="815" y="592" width="715" height="214" rx="14" fill="#131312" stroke="#282826" stroke-width="1.5"/><text x="843" y="630" class="tagA">Put in the checker&#8217;s prompt</text><circle cx="848" cy="665" r="3.5" fill="#FFD644"/><text x="865" y="672" class="small">Every dimension that matters, named</text><circle cx="848" cy="697" r="3.5" fill="#FFD644"/><text x="865" y="704" class="small">The spec or issue it must check against</text><circle cx="848" cy="729" r="3.5" fill="#FFD644"/><text x="865" y="736" class="small">&#8220;Try to refute this. Default to fail&#8221;</text><text x="70" y="855" class="small">The agent that wrote the code is far too kind grading its own homework.</text>
</svg>