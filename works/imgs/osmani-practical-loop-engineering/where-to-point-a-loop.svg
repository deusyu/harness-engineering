<rect width="1600" height="940" fill="#0A0A0A"/>
<rect width="1600" height="940" fill="url(#glow)"/>
<text x="70" y="62" class="kicker">Practical loop engineering &#183; addyosmani.com</text>
<rect x="1468" y="38" width="62" height="34" rx="17" fill="#FFD644"/>
<text x="1499" y="62" class="badge" text-anchor="middle">10</text>
<text x="70" y="902" class="foot">addyosmani.com</text>
<text x="70" y="160" class="h1">Where to point a loop</text><text x="70" y="226" class="lede">The task does not decide this. The quality of the check you can write decides it.</text>
<rect x="70" y="268" width="715" height="396" rx="14" fill="#131312" stroke="#282826" stroke-width="1.5"/><text x="98" y="308" class="tag" fill="#7ED9A6">Loop it</text><circle cx="103" cy="349" r="3.5" fill="#7ED9A6"/><text x="120" y="356" class="small">Greenfield with a clear spec</text><circle cx="103" cy="391" r="3.5" fill="#7ED9A6"/><text x="120" y="398" class="small">Well-fenced modules with tests around them</text><circle cx="103" cy="433" r="3.5" fill="#7ED9A6"/><text x="120" y="440" class="small">Triage and label hygiene</text><circle cx="103" cy="475" r="3.5" fill="#7ED9A6"/><text x="120" y="482" class="small">Dependency bumps and codemods</text><circle cx="103" cy="517" r="3.5" fill="#7ED9A6"/><text x="120" y="524" class="small">Mechanical migrations</text><circle cx="103" cy="559" r="3.5" fill="#7ED9A6"/><text x="120" y="566" class="small">Perf work with a number attached</text><circle cx="103" cy="601" r="3.5" fill="#7ED9A6"/><text x="120" y="608" class="small">Anything you already run every morning</text><rect x="815" y="268" width="715" height="396" rx="14" fill="#1C1209" stroke="#5A3A1E" stroke-width="1.5"/><text x="843" y="308" class="tag" fill="#FF9E64">Hold the reins</text><circle cx="848" cy="349" r="3.5" fill="#FF9E64"/><text x="865" y="356" class="small">Fuzzy goals that would loop forever</text><circle cx="848" cy="391" r="3.5" fill="#FF9E64"/><text x="865" y="398" class="small">Deep-judgment architecture calls</text><circle cx="848" cy="433" r="3.5" fill="#FF9E64"/><text x="865" y="440" class="small">Schema and data-model design</text><circle cx="848" cy="475" r="3.5" fill="#FF9E64"/><text x="865" y="482" class="small">Brownfield, until a research pass maps it</text><circle cx="848" cy="517" r="3.5" fill="#FF9E64"/><text x="865" y="524" class="small">Anything where &#8220;done&#8221; is a matter of taste</text><circle cx="848" cy="559" r="3.5" fill="#FF9E64"/><text x="865" y="566" class="small">Work with real users and no rollback</text><circle cx="848" cy="601" r="3.5" fill="#FF9E64"/><text x="865" y="608" class="small">First runs of anything new</text><rect x="70" y="700" width="1460" height="74" rx="14" fill="#1A1608" stroke="#7A6820" stroke-width="1.5"/><rect x="70" y="700" width="5" height="74" rx="2.5" fill="#FFD644"/><text x="96" y="745.0" class="body b" fill="#F5F3ED">Back pressure: grant a loop only as much autonomy as you can cheaply verify &#8212; not one inch more.</text><rect x="70" y="796" width="1460" height="66" rx="14" fill="#131312" stroke="#282826" stroke-width="1.5"/><text x="98" y="838" class="small">The level you can safely reach rises with the strength of the check, not the size of the task. Cheap generation raises the value of verification; it does not lower it.</text>
</svg>